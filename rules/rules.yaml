# ==========================================
# Detection Rules Catalog: BH001 - BH008
# ==========================================

rules:
  - id: "BH001"
    name: "Browser launched with extension/proxy flags"
    description: "Detects browser processes launched with suspicious command-line flags"
    event_type: "process_create"
    conditions:
      - field: "process_image"
        match: "contains"
        values: ["chrome.exe", "msedge.exe"]
      - field: "command_line"
        match: "regex"
        values:
          - "(?i)--proxy-server="
          - "(?i)--load-extension="
          - "(?i)--disable-extensions-except="
          - "(?i)--proxy-pac-url="
    base_score: 40
    mitre_ids: ["T1090", "T1176"]
    explanation_template: >
      Browser process {process_image} was launched with suspicious flag(s) in command line:
      "{command_line}". Parent process: {parent_image}. This matches rule BH001 (MITRE T1090, T1176).

  - id: "BH002"
    name: "Browser policy registry modified"
    description: "Detects unauthorized modifications to Chrome or Edge policy registry keys"
    event_type: ["registry_set", "registry_add"]
    conditions:
      - field: "registry_key"
        match: "regex"
        values:
          - "(?i)SOFTWARE\\\\Policies\\\\Google\\\\Chrome"
          - "(?i)SOFTWARE\\\\Policies\\\\Microsoft\\\\Edge"
    base_score: 50
    mitre_ids: ["T1112"]
    explanation_template: >
      Browser policy registry key was modified: {registry_key}\\{registry_value_name}
      set to "{registry_value}". Browser policies can force homepage, search engine,
      and extension installations (MITRE T1112).

  - id: "BH003"
    name: "System proxy / PAC script changed"
    description: "Detects modifications to system-wide proxy or auto-config URL settings"
    event_type: ["registry_set", "registry_add"]
    conditions:
      - field: "registry_key"
        match: "contains"
        values: ["Internet Settings"]
      - field: "registry_value_name"
        match: "in_list"
        values: ["ProxyServer", "ProxyEnable", "AutoConfigURL"]
    base_score: 30
    mitre_ids: ["T1090"]
    explanation_template: >
      System proxy setting was modified: {registry_value_name} set to "{registry_value}"
      in {registry_key}. This may redirect outbound web traffic through an unauthorized proxy (MITRE T1090).

  - id: "BH004"
    name: "Hosts file modified"
    description: "Detects modifications to the Windows hosts file"
    event_type: "file_create"
    conditions:
      - field: "file_path"
        match: "ends_with"
        values: ["\\drivers\\etc\\hosts", "/drivers/etc/hosts"]
    base_score: 40
    mitre_ids: ["T1565.001"]
    explanation_template: >
      Windows hosts file was modified: {file_path}. Unauthorized hosts file changes
      can hijack domain resolution and redirect users to attacker infrastructure (MITRE T1565.001).

  - id: "BH005"
    name: "Browser shortcut modified"
    description: "Detects modifications to browser .lnk shortcut files"
    event_type: "file_create"
    conditions:
      - field: "file_path"
        match: "regex"
        values:
          - "(?i)(chrome|msedge|edge)\\.lnk$"
          - "(?i)Google Chrome\\.lnk$"
          - "(?i)Microsoft Edge\\.lnk$"
    base_score: 30
    mitre_ids: ["T1547.009"]
    explanation_template: >
      Browser shortcut file was created or modified: {file_path}. Modified shortcuts
      can inject malicious command-line arguments upon user launch (MITRE T1547.009).

  - id: "BH006"
    name: "Suspicious scheduled task or service"
    description: "Detects creation of scheduled tasks or services that may relate to hijacking"
    event_type: ["task_create", "service_install"]
    conditions:
      - field: "command_line"
        match: "regex"
        values:
          - "(?i)(chrome|msedge|edge|browser|search|homepage)"
          - "(?i)(proxy|redirect|inject)"
    base_score: 35
    mitre_ids: ["T1053.005", "T1543.003"]
    explanation_template: >
      A scheduled task or service was installed with browser-related parameters:
      "{command_line}". This persistence mechanism may maintain a browser hijack (MITRE T1053.005, T1543.003).

  - id: "BH007"
    name: "Security log cleared"
    description: "Detects clearing of the Windows Security event log (defense evasion)"
    event_type: "log_cleared"
    conditions:
      - field: "type"
        match: "equals"
        values: ["log_cleared"]
    base_score: 60
    mitre_ids: ["T1070.001"]
    explanation_template: >
      The Windows Security audit log was cleared by user {user}. This defense evasion
      technique indicates an attempt to destroy forensic evidence (MITRE T1070.001).

  - id: "BH008"
    name: "Root certificate added"
    description: "Detects addition of root certificates to the trusted store"
    event_type: ["registry_set", "registry_add"]
    conditions:
      - field: "registry_key"
        match: "contains"
        values:
          - "ROOT\\Certificates"
          - "AuthRoot\\Certificates"
          - "ROOT/Certificates"
          - "AuthRoot/Certificates"
    base_score: 45
    mitre_ids: ["T1553.004"]
    explanation_template: >
      A root certificate was added to the Windows trusted certificate store:
      {registry_key}. Rogue root certificates allow interception of encrypted HTTPS traffic (MITRE T1553.004).
