name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test-and-lint:
    name: Python Lint & Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pyyaml requests boto3 pytest pytest-cov ruff

      - name: Run Ruff Linter
        run: |
          ruff check agent cloud tests

      - name: Run Pytest Suite
        run: |
          pytest -v --cov=agent --cov=cloud/lambda --cov-report=term

  terraform-lint-and-validate:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Check Terraform Formatting
        run: |
          terraform fmt -check -diff

      - name: Initialize Terraform (Validation Mode)
        run: |
          terraform init -backend=false

      - name: Validate Terraform Files
        run: |
          terraform validate

  dashboard-build:
    name: React Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Dashboard Bundle
        run: |
          npm run build
